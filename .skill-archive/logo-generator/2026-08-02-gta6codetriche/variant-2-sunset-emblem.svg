<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="sunGrad" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFC94D"/>
      <stop offset="40%" stop-color="#FF7A3D"/>
      <stop offset="80%" stop-color="#FF2E9A"/>
      <stop offset="100%" stop-color="#0B0221"/>
    </radialGradient>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0221"/>
      <stop offset="40%" stop-color="#1a0a3e"/>
      <stop offset="70%" stop-color="#FF2E9A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF7A3D" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B0221"/>
    </linearGradient>
    <clipPath id="emblemClip">
      <circle cx="400" cy="140" r="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0B0221"/>

  <!-- Emblem Outer Ring Glow -->
  <circle cx="400" cy="140" r="125" fill="none" stroke="#FF2E9A" stroke-width="3" filter="url(#neonPink)"/>
  <circle cx="400" cy="140" r="118" fill="none" stroke="#22D3EE" stroke-width="1.5" filter="url(#neonCyan)"/>

  <!-- Sun inside emblem -->
  <g clip-path="url(#emblemClip)">
    <!-- Sky gradient -->
    <rect x="280" y="20" width="240" height="260" fill="url(#horizonGrad)"/>
    <!-- Sun -->
    <circle cx="400" cy="160" r="50" fill="url(#sunGrad)" filter="url(#neonOrange)"/>
    <!-- Sun rays -->
    <g opacity="0.3">
      <line x1="400" y1="80" x2="400" y2="100" stroke="#FFC94D" stroke-width="2"/>
      <line x1="350" y1="100" x2="365" y2="115" stroke="#FFC94D" stroke-width="1.5"/>
      <line x1="450" y1="100" x2="435" y2="115" stroke="#FFC94D" stroke-width="1.5"/>
      <line x1="320" y1="140" x2="340" y2="140" stroke="#FFC94D" stroke-width="1.5"/>
      <line x1="460" y1="140" x2="480" y2="140" stroke="#FFC94D" stroke-width="1.5"/>
    </g>
    <!-- Water reflection -->
    <rect x="280" y="195" width="240" height="85" fill="url(#waterGrad)"/>
    <!-- Horizontal lines for water -->
    <line x1="290" y1="210" x2="510" y2="210" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="225" x2="500" y2="225" stroke="#22D3EE" stroke-width="0.5" opacity="0.2"/>
    <line x1="310" y1="240" x2="490" y2="240" stroke="#22D3EE" stroke-width="0.5" opacity="0.15"/>
    <!-- Palm Silhouettes -->
    <g transform="translate(310, 60)" opacity="0.6">
      <rect x="0" y="70" width="4" height="60" fill="#0B0221"/>
      <path d="M2,70 Q2,60 -15,40 Q-5,55 0,62 Q-10,45 -30,30 Q-10,50 0,62 L2,70" fill="#0B0221"/>
      <path d="M2,70 Q2,60 20,40 Q10,55 4,62 Q15,45 35,30 Q15,50 4,62 L2,70" fill="#0B0221"/>
    </g>
    <g transform="translate(470, 80)" opacity="0.4">
      <rect x="0" y="50" width="3" height="45" fill="#0B0221"/>
      <path d="M1.5,50 Q1,40 -12,25 Q0,38 1,45 Q-5,30 -22,18 Q-5,35 1,45 L1.5,50" fill="#0B0221"/>
    </g>
  </g>

  <!-- Inner Ring Border -->
  <circle cx="400" cy="140" r="120" fill="none" stroke="#FF2E9A" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="140" r="115" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.5"/>

  <!-- GTA6 Text on emblem -->
  <text x="400" y="155" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="60" font-weight="900" fill="#FFC94D" filter="url(#neonOrange)">GTA 6</text>

  <!-- CODETRICHE below emblem -->
  <text x="400" y="285" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="700" letter-spacing="8" fill="#22D3EE" filter="url(#neonCyan)">CODETRICHE</text>

  <!-- .fr small -->
  <text x="640" y="285" font-family="'Courier New',monospace" font-size="14" font-weight="400" fill="#FF7A3D" opacity="0.8">.fr</text>
</svg>