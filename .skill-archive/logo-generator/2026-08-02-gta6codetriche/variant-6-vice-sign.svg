<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E9A"/>
      <stop offset="50%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FFC94D"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="leftPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2E9A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF2E9A" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0B0221"/>

  <!-- Art Deco Border Frame -->
  <rect x="20" y="20" width="760" height="260" rx="8" fill="none" stroke="#FF2E9A" stroke-width="2" filter="url(#neonPink)" opacity="0.6"/>
  <rect x="30" y="30" width="740" height="240" rx="5" fill="none" stroke="#22D3EE" stroke-width="1" filter="url(#neonCyan)" opacity="0.4"/>

  <!-- Art Deco Pillars Left -->
  <rect x="50" y="40" width="8" height="220" fill="url(#leftPillar)" filter="url(#neonPink)" opacity="0.5"/>
  <rect x="65" y="60" width="4" height="180" fill="url(#leftPillar)" opacity="0.3"/>
  <!-- Art Deco Pillars Right -->
  <rect x="742" y="40" width="8" height="220" fill="url(#pillarGrad)" filter="url(#neonCyan)" opacity="0.5"/>
  <rect x="731" y="60" width="4" height="180" fill="url(#pillarGrad)" opacity="0.3"/>

  <!-- Top decorative arch -->
  <path d="M200,45 Q400,10 600,45" fill="none" stroke="#FFC94D" stroke-width="1.5" filter="url(#neonYellow)" opacity="0.5"/>
  <circle cx="400" cy="35" r="4" fill="#FFC94D" filter="url(#neonYellow)" opacity="0.8"/>
  <circle cx="300" cy="38" r="2" fill="#FFC94D" opacity="0.5"/>
  <circle cx="500" cy="38" r="2" fill="#FFC94D" opacity="0.5"/>

  <!-- Palm tree left -->
  <g transform="translate(100, 40)" opacity="0.35">
    <rect x="10" y="80" width="5" height="140" fill="#FF2E9A" rx="2"/>
    <path d="M12,80 Q12,60 -15,30 Q-5,50 5,65 Q-10,45 -40,20 Q-20,50 -3,68 L12,80" fill="#22D3EE" filter="url(#neonCyan)"/>
    <path d="M12,80 Q12,60 40,25 Q20,50 10,65 Q25,40 55,15 Q30,50 15,68 L12,80" fill="#22D3EE" filter="url(#neonCyan)"/>
    <path d="M12,80 Q12,65 -25,45 Q-8,58 3,72 L12,80" fill="#22D3EE" opacity="0.7"/>
    <path d="M12,80 Q12,65 35,40 Q18,58 8,72 L12,80" fill="#22D3EE" opacity="0.7"/>
  </g>

  <!-- Palm tree right -->
  <g transform="translate(660, 50)" opacity="0.3">
    <rect x="8" y="70" width="4" height="120" fill="#FF2E9A" rx="2"/>
    <path d="M10,70 Q10,55 -12,30 Q0,45 5,58 Q-8,40 -30,18 Q-15,42 -1,60 L10,70" fill="#22D3EE" filter="url(#neonCyan)"/>
    <path d="M10,70 Q10,55 30,28 Q15,45 8,58 Q20,38 45,15 Q25,42 13,60 L10,70" fill="#22D3EE" filter="url(#neonCyan)"/>
  </g>

  <!-- VICE CITY top text -->
  <text x="400" y="80" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="28" font-weight="900" letter-spacing="20" fill="#FFC94D" filter="url(#neonYellow)" opacity="0.7">VICE CITY</text>

  <!-- 3D Shadow -->
  <text x="400" y="170" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="100" font-weight="900" fill="#0B0221" transform="translate(6,6)">GTA 6</text>
  <text x="400" y="170" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="100" font-weight="900" fill="#1a0a3e" transform="translate(3,3)">GTA 6</text>

  <!-- Main GTA6 -->
  <text x="400" y="170" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="100" font-weight="900" fill="url(#sunsetGrad)" filter="url(#neonPink)">GTA 6</text>

  <!-- Decorative line -->
  <line x1="150" y1="190" x2="350" y2="190" stroke="#FF7A3D" stroke-width="1.5" filter="url(#neonOrange)" opacity="0.7"/>
  <polygon points="400,185 408,190 400,195 392,190" fill="#FFC94D" filter="url(#neonYellow)" opacity="0.9"/>
  <line x1="450" y1="190" x2="650" y2="190" stroke="#FF7A3D" stroke-width="1.5" filter="url(#neonOrange)" opacity="0.7"/>

  <!-- CODETRICHE.FR -->
  <text x="400" y="240" text-anchor="middle" font-family="'Courier New','monospace'" font-size="24" font-weight="700" letter-spacing="8" fill="#22D3EE" filter="url(#neonCyan)">CODETRICHE.FR</text>

  <!-- Bottom decorative dots -->
  <circle cx="340" cy="258" r="2" fill="#FF2E9A" opacity="0.5"/>
  <circle cx="360" cy="258" r="2" fill="#FF7A3D" opacity="0.5"/>
  <circle cx="380" cy="258" r="2" fill="#FFC94D" opacity="0.5"/>
  <circle cx="400" cy="258" r="2" fill="#22D3EE" opacity="0.5"/>
  <circle cx="420" cy="258" r="2" fill="#FFC94D" opacity="0.5"/>
  <circle cx="440" cy="258" r="2" fill="#FF7A3D" opacity="0.5"/>
  <circle cx="460" cy="258" r="2" fill="#FF2E9A" opacity="0.5"/>

  <!-- Scan lines overlay -->
  <g opacity="0.04">
    <rect x="20" y="20" width="760" height="1" fill="white"/>
    <rect x="20" y="40" width="760" height="1" fill="white"/>
    <rect x="20" y="60" width="760" height="1" fill="white"/>
    <rect x="20" y="80" width="760" height="1" fill="white"/>
    <rect x="20" y="100" width="760" height="1" fill="white"/>
    <rect x="20" y="120" width="760" height="1" fill="white"/>
    <rect x="20" y="140" width="760" height="1" fill="white"/>
    <rect x="20" y="160" width="760" height="1" fill="white"/>
    <rect x="20" y="180" width="760" height="1" fill="white"/>
    <rect x="20" y="200" width="760" height="1" fill="white"/>
    <rect x="20" y="220" width="760" height="1" fill="white"/>
    <rect x="20" y="240" width="760" height="1" fill="white"/>
    <rect x="20" y="260" width="760" height="1" fill="white"/>
  </g>
</svg>