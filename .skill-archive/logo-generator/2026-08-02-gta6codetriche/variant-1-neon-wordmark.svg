<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <!-- Neon Pink Glow -->
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2" in="SourceGraphic"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Neon Cyan Glow -->
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2" in="SourceGraphic"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Orange Glow -->
    <filter id="neonOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="1" result="blur2" in="SourceGraphic"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 3D Extrusion -->
    <filter id="extrude3d" x="-10%" y="-10%" width="130%" height="130%">
      <feOffset in="SourceGraphic" dx="4" dy="4" result="shadow3"/>
      <feOffset in="SourceGraphic" dx="3" dy="3" result="shadow2"/>
      <feOffset in="SourceGraphic" dx="2" dy="2" result="shadow1"/>
      <feFlood flood-color="#FF2E9A" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="shadow3" operator="in" result="colored3"/>
      <feMerge>
        <feMergeNode in="colored3"/>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sunset Gradient -->
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E9A"/>
      <stop offset="50%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FFC94D"/>
    </linearGradient>
    <!-- Cyan to Pink -->
    <linearGradient id="cyanPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FF2E9A"/>
    </linearGradient>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF2E9A" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="300" fill="#0B0221"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <!-- Horizon Line Glow -->
  <line x1="0" y1="230" x2="800" y2="230" stroke="#FF2E9A" stroke-width="1" opacity="0.4" filter="url(#neonPink)"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="#22D3EE" stroke-width="0.5" opacity="0.2"/>

  <!-- Palm Tree Silhouette Left -->
  <g transform="translate(50, 80)" opacity="0.25">
    <path d="M0,150 L0,60 Q-5,55 -25,30 Q-15,45 -5,55 Q-15,40 -35,20 Q-20,38 -8,52 Q-20,35 -45,25 Q-25,42 -10,55 L0,60" fill="#FF2E9A" filter="url(#neonPink)"/>
  </g>

  <!-- Palm Tree Silhouette Right -->
  <g transform="translate(720, 100)" opacity="0.2">
    <path d="M0,130 L0,50 Q5,45 30,25 Q15,40 5,48 Q18,30 50,15 Q30,35 8,48 L0,50" fill="#22D3EE" filter="url(#neonCyan)"/>
  </g>

  <!-- 3D Extruded Shadow for GTA6 -->
  <text x="400" y="145" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="110" font-weight="900" fill="#0B0221" opacity="0.6" transform="translate(6,6)">GTA 6</text>
  <text x="400" y="145" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="110" font-weight="900" fill="#1a0a3e" transform="translate(4,4)">GTA 6</text>
  <text x="400" y="145" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="110" font-weight="900" fill="#2d1060" transform="translate(2,2)">GTA 6</text>

  <!-- Main GTA6 Text with Neon -->
  <text x="400" y="145" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="110" font-weight="900" fill="url(#sunsetGrad)" filter="url(#neonPink)">GTA 6</text>

  <!-- CODETRICHE.FR subtitle -->
  <text x="400" y="200" text-anchor="middle" font-family="'Courier New','monospace'" font-size="32" font-weight="700" letter-spacing="12" fill="#22D3EE" filter="url(#neonCyan)">CODETRICHE.FR</text>

  <!-- Decorative Lines -->
  <line x1="120" y1="215" x2="300" y2="215" stroke="#FF7A3D" stroke-width="1.5" filter="url(#neonOrange)"/>
  <line x1="500" y1="215" x2="680" y2="215" stroke="#FF7A3D" stroke-width="1.5" filter="url(#neonOrange)"/>

  <!-- Small diamond accent -->
  <polygon points="400,210 406,215 400,220 394,215" fill="#FFC94D" filter="url(#neonOrange)"/>

  <!-- Scan line effect -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#fff" stroke-width="1"/>
  </g>
</svg>